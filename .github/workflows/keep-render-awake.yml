name: keep-render-awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping ML service
        run: curl -fsS -m 60 -o /dev/null -w '%{http_code}\n' https://cropy-yield-ml-model.onrender.com/api/health || true
      - name: Ping backend
        run: curl -fsS -m 60 -o /dev/null -w '%{http_code}\n' https://cropy-yield-backend.onrender.com/api/health || true
      - name: Ping frontend
        run: curl -fsS -m 60 -o /dev/null -w '%{http_code}\n' https://cropy-yield-frontend.onrender.com/ || true